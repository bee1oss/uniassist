services:
  mysql:
    image: mysql:8.0
    container_name: secure_api_mysql
    environment:
      MYSQL_DATABASE: uniassist
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravelpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: